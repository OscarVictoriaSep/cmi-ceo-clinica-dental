<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  html,body{margin:0;padding:0}
  #root{min-height:100vh}
  .cmi { --bg:#0B0B0C; --surf:#151517; --surf2:#1C1C1F; --line:#2A2A2F;
         --txt:#FFFFFF; --dim:#9A9AA2; --bone:#E3E3E3;
         --ok:#4ADE80; --warn:#FBBF24; --bad:#FB7185;
         --meta:#4C9AFF; --goog:#34D399; --club:#F472B6; --mix:#FB923C; --op:#A78BFA;
         background:var(--bg); color:var(--txt);
         font-family:'IBM Plex Sans',system-ui,sans-serif;
         min-height:100vh; -webkit-font-smoothing:antialiased; }
  .cmi *,.cmi *::before,.cmi *::after{box-sizing:border-box}
  .cmi h1,.cmi h2,.cmi h3,.cmi .disp{font-family:'Bebas Neue',Impact,sans-serif;
    font-weight:400; letter-spacing:.04em; margin:0}
  .cmi .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}
  .cmi button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  .cmi button:focus-visible,.cmi input:focus-visible,.cmi select:focus-visible{
    outline:2px solid var(--bone); outline-offset:2px}
  .cmi input,.cmi select{font-family:inherit; background:var(--surf2); color:var(--txt);
    border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:13px; width:100%}
  .cmi input::placeholder{color:#5A5A62}
  .cmi table{width:100%; border-collapse:collapse}
  .cmi th{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim);
    font-weight:600; text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
  .cmi td{padding:8px 10px; border-bottom:1px solid #202024; font-size:13px}
  .cmi tbody tr:hover td{background:#1A1A1D}
  .cmi .num{text-align:right; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#0B0B0C}
  ::-webkit-scrollbar-thumb{background:#2A2A2F;border-radius:5px}
</style>

</div>
<script>
  window.addEventListener("error", function(ev) {
    var root = document.getElementById("root");
    if (root && root.dataset.appReady) return;
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;background:#0B0B0C;color:#fff;font-family:system-ui,sans-serif">' +
      '<div><div style="font-size:24px;font-weight:700;color:#FB7185">NO SE PUDO INICIAR EL PANEL</div>' +
      '<div style="font-size:13px;color:#9A9AA2;margin-top:10px;max-width:440px">' + (ev.message || "Error desconocido al cargar un recurso.") + '</div>' +
      '<div style="font-size:11px;color:#5A5A62;margin-top:16px">Revisa tu conexión a internet y recarga la página. Si el problema persiste, avisa a Claude con este mensaje.</div></div></div>';
  }, true);
</script>

  /* ═══════════════════ APP PRINCIPAL ═══════════════════ */
  function PanelCMI({
    session,
    onLogout
  }) {
    const [listo, setListo] = useState(false);
    const [acc, setAcc] = useState([]);
    const [pn, setPn] = useState([]);
    const [afiliados, setAfiliados] = useState([]);
    const [inversion, setInversion] = useState({});
    const [periodo, setPeriodo] = useState(null);
    const [tab, setTab] = useState("resumen");
    const [aviso, setAviso] = useState(null);
    const [cargando, setCargando] = useState(false);
    const refAcc = useRef(null),
      refPn = useRef(null),
      refAf = useRef(null);
    const notificar = (tipo, texto) => {
      setAviso({
        tipo,
        texto
      });
      setTimeout(() => setAviso(null), 7000);
    };
    const traerTodasLasFilas = async (tabla, columnas) => {
      let todas = [];
      let desde = 0;
      const tamanoPagina = 1000;
      while (true) {
        const { data, error } = await sb.from(tabla).select(columnas)
          .range(desde, desde + tamanoPagina - 1);
        if (error) { console.error("Error trayendo " + tabla, error); break; }
        if (!data || data.length === 0) break;
        todas = todas.concat(data);
        if (data.length < tamanoPagina) break;
        desde += tamanoPagina;
      }
      return todas;
    };
    const cargarTodo = async () => {
      const [da, dp, df, di] = await Promise.all([
        traerTodasLasFilas("cmi_acciones", "*"),
        traerTodasLasFilas("cmi_pacientes_nuevos", "*"),
        traerTodasLasFilas("cmi_afiliados", "rut"),
        traerTodasLasFilas("cmi_inversion", "*"),
      ]);
      setAcc((da || []).map(accToArr));
      setPn((dp || []).map(pnToArr));
      setAfiliados((df || []).map(r => r.rut));
      const invObj = {};
      (di || []).forEach(r => {
        invObj[r.periodo] = {
          meta: Number(r.meta) || 0,
          google: Number(r.google) || 0
        };
      });
      setInversion(invObj);
      const disp = [...new Set([...(da || []).map(r => r.periodo), ...(dp || []).map(r => r.periodo)])].sort();
      setPeriodo(prev => prev && disp.includes(prev) ? prev : disp.length ? disp[disp.length - 1] : null);
    };
    useEffect(() => {
      (async () => {
        await cargarTodo();
        setListo(true);
      })();
    }, []);
    const periodosAcc = useMemo(() => [...new Set(acc.map(f => f[A_PER]))].sort(), [acc]);
    const periodosPn = useMemo(() => [...new Set(pn.map(r => r[P_PER]))].sort(), [pn]);
    const periodos = useMemo(() => [...new Set([...periodosAcc, ...periodosPn])].sort(), [periodosAcc, periodosPn]);
    const idx = useMemo(() => construirIndices(acc, pn), [acc, pn]);
    const K = useMemo(() => periodo ? calcularPeriodo(periodo, acc, pn, inversion, idx) : null, [periodo, acc, pn, inversion, idx]);
    const V = useMemo(() => periodo ? calcularVentanas(periodo, acc, afiliados) : null, [periodo, acc, afiliados]);
    const serie = useMemo(() => periodos.map(p => {
      const k = calcularPeriodo(p, acc, pn, inversion, idx);
      return {
        periodo: p,
        label: pLabel(p),
        facturacion: k.facturacion,
        atenciones: k.atenciones,
        ingAtencion: Math.round(k.ingAtencion),
        casosOrto: k.casosOrto,
        casosImpl: k.casosImpl,
        club: k.clubTotal,
        referidos: k.referidos.pacientes
      };
    }), [periodos, acc, pn, inversion, idx]);

    /* — Subir Acciones Realizadas — */
    const subirAcciones = file => {
      setCargando(true);
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        encoding: "UTF-8",
