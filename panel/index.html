<script type="text/babel" data-presets="react,env">
try {

if (!window.React) throw new Error("React no cargó. Revisa tu conexión a internet y recarga la página.");
if (!window.ReactDOM) throw new Error("ReactDOM no cargó. Revisa tu conexión a internet y recarga la página.");

const { useState, useEffect, useMemo, useRef } = React;
const {
  BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
  LineChart, Line, Legend, Cell
} = Recharts;

/* ═══════════════════ CONFIGURACIÓN SUPABASE ═══════════════════ */
const SUPABASE_URL = "https://imhtzamtahmnrwndeylt.supabase.co";
const SUPABASE_KEY = "sb_publishable_2ERQh_kOPE5uKuZHP9sHCA_zrTpxCQU";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ═══════════════════ CONSTANTES ═══════════════════ */
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
               "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MES_ABR = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MES_IDX = Object.fromEntries(MESES.map((m,i)=>[m.toLowerCase(), i+1]));

const CATEGORIAS = [
  "ORTODONCIA","IMPLANTOLOGÍA","REHABILITACIÓN ORAL","ODONTOLOGÍA GENERAL",
  "ENDODONCIA","PERIODONCIA","ODONTOLOGIA ESTETICA","CIRUGIA ORAL","ALINEADORES",
  "ESTETICA FACIAL","PRODUCTOS VENTAS","Laboratorios","Promociones General",
  "Promociones Especialistas"
];

const METAS = {
  ingresoAtencion: 45000, atenciones: 487, pacientesUnicos: 415,
  produccionSillon: 10986906, trazabilidad: 0.90, roas: 3.5,
  casosOrto: 12, casosImpl: 11,
  clubOtros: 12754839, clubOrto: 5094270, clubTotal: 17849110, clubPctOtros: 0.70,
  afiliacion: 0.70, retorno: 0.60, referidos: 3, ingresoReferidos: 600000,
};

/* ═══════════════════ UTILIDADES ═══════════════════ */
const normRut = (s) => String(s ?? "").trim().toUpperCase().replace(/[.\s]/g, "");

const normCat = (c) => {
  const s = String(c ?? "").trim();
  if (!s) return "";
  const u = s.toUpperCase();
  if (u === "ACCIONES DE ORTODONCIA" || u === "ORTODONCIA") return "ORTODONCIA";
  if (u.includes("REHABILITACI")) return "REHABILITACIÓN ORAL";
  if (u.includes("IMPLANTOLOG")) return "IMPLANTOLOGÍA";
  return s;
};

const toNum = (v) => {
  if (v === null || v === undefined || v === "") return 0;
  if (typeof v === "number") return v;
  let s = String(v).replace(/[$\s]/g, "");
  if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
  else if (s.includes(",")) {
    const p = s.split(",");
    s = (p.length === 2 && p[1].length <= 2) ? s.replace(",", ".") : s.replace(/,/g, "");
  } else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, "");
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
};

const pKey = (mes, anio) => {
  const mi = MES_IDX[String(mes ?? "").trim().toLowerCase()];
  const a = parseInt(anio, 10);
  if (!mi || !a) return null;
  return `${a}-${String(mi).padStart(2, "0")}`;
};

const pSerial = (k) => { const [a,m] = k.split("-").map(Number); return a*12 + m; };
const pLabel  = (k) => { const [a,m] = k.split("-").map(Number); return `${MES_ABR[m-1]} ${a}`; };
const pLargo  = (k) => { const [a,m] = k.split("-").map(Number); return `${MESES[m-1]} ${a}`; };

const clp = (n) => (n === null || n === undefined || !Number.isFinite(n))
  ? "—" : "$" + Math.round(n).toLocaleString("es-CL");
const clpK = (n) => {
  if (!Number.isFinite(n)) return "—";
  if (Math.abs(n) >= 1e6) return "$" + (n/1e6).toFixed(1) + "M";
  if (Math.abs(n) >= 1e3) return "$" + Math.round(n/1e3) + "K";
  return "$" + Math.round(n);
};
const pct = (n, d=1) => Number.isFinite(n) ? (n*100).toFixed(d) + "%" : "—";
const xN  = (n) => Number.isFinite(n) ? n.toFixed(2) + "x" : "—";
const ent = (n) => Number.isFinite(n) ? Math.round(n).toLocaleString("es-CL") : "—";

const canalDe = (r) => {
  const u = String(r ?? "").trim().toUpperCase();
  if (u === "REDES SOCIALES") return "META";
  if (u === "GOOGLE") return "GOOGLE";
  if (u.startsWith("REFERIDO")) return "REFERIDOS";
  if (u === "ORGANICO" || u === "ORGÁNICO") return "ORGANICO";
  return u ? "OTRO" : "";
};

const PIEZA_RE = /^\d+\s*:/;
const esImplanteValido = (prest) => {
  const p = String(prest ?? "").toLowerCase();
  return !p.includes("corona sobre impl") && !p.includes("pilar sobre impl");
};

const A_PID=0, A_RUT=1, A_PER=2, A_FEC=3, A_PRE=4, A_PAG=5,
      A_CON=6, A_CAT=7, A_TRA=8, A_PZA=9, A_DOC=10;
const P_PER=0, P_PID=1, P_REF=4;

function mapAcciones(rows) {
  const out = new Map();
  let ignoradas = 0;
  for (const r of rows) {
    const per = pKey(r["Mes de realización"], r["Año de realización"]);
    const pid = String(r["# Paciente"] ?? "").trim();
    if (!per || !pid) { ignoradas++; continue; }
    const fila = {
      periodo: per, pid, rut: normRut(r["RUT Paciente"]),
      fecha: String(r["Fecha de realización"] ?? "").trim(),
      prestacion: String(r["Nombre Prestación"] ?? "").trim(),
      pagado: toNum(r["Pagado Paciente Prestación (Abonado)"]),
      convenio: String(r["Convenio Paciente"] ?? "").trim().toUpperCase(),
      categoria: normCat(r["Nombre Categoria"]),
      tratamiento: String(r["# Tratamiento"] ?? "").trim(),
      pieza: String(r["Pieza Tratada"] ?? "").trim(),
      doctor: `${String(r["Nombre Profesional Realizador"] ?? "").trim()} ${String(r["Apellidos Profesional Realizador"] ?? "").trim()}`.trim(),
    };
    if (!out.has(per)) out.set(per, []);
    out.get(per).push(fila);
  }
  return { grupos: out, ignoradas };
}

function mapPacientes(rows) {
  const out = new Map();
  let ignoradas = 0;
  for (const r of rows) {
    const per = pKey(r["Mes de afiliación"], r["Año de afiliación"]);
    const pid = String(r["# Paciente"] ?? "").trim();
    if (!per || !pid) { ignoradas++; continue; }
    const fila = {
      periodo: per, pid, rut: normRut(r["RUT Paciente"]),
      referencia: String(r["Referencia Paciente"] ?? "").trim().toUpperCase(),
    };
    if (!out.has(per)) out.set(per, []);
    out.get(per).push(fila);
  }
  return { grupos: out, ignoradas };
}

/* Convierte filas de Supabase (objetos con nombre de columna) a arreglos compactos internos */
const accToArr = (r) => [r.pid, r.rut||"", r.periodo, r.fecha||"", r.prestacion||"", Number(r.pagado)||0,
                          r.convenio||"", r.categoria||"", r.tratamiento||"", r.pieza||"", r.doctor||""];
const pnToArr  = (r) => [r.periodo, r.pid, r.rut||"", "", r.referencia||""];

/* ═══════════════════ CÁLCULO DE INDICADORES ═══════════════════ */
function construirIndices(acc, pn) {
  const pidsNuevos = new Set(pn.map(r => r[P_PID]));
  const primeraOrto = new Map();
  const primeraImpl = new Map();
  for (const f of acc) {
    const per = f[A_PER];
    if (f[A_CAT] === "ORTODONCIA" && pidsNuevos.has(f[A_PID])) {
      const prev = primeraOrto.get(f[A_PID]);
      if (!prev || per < prev) primeraOrto.set(f[A_PID], per);
    }
    if (f[A_CAT] === "IMPLANTOLOGÍA" && f[A_PZA] && PIEZA_RE.test(f[A_PZA]) && esImplanteValido(f[A_PRE])) {
      const k = f[A_PID] + "|" + f[A_PZA];
      const prev = primeraImpl.get(k);
      if (!prev || per < prev) primeraImpl.set(k, per);
    }
  }
  const pagoPorPid = new Map();
  const pagoPorPidPer = new Map();
  for (const f of acc) {
    pagoPorPid.set(f[A_PID], (pagoPorPid.get(f[A_PID]) || 0) + f[A_PAG]);
    const k = f[A_PID] + "|" + f[A_PER];
    pagoPorPidPer.set(k, (pagoPorPidPer.get(k) || 0) + f[A_PAG]);
  }
  return { primeraOrto, primeraImpl, pagoPorPid, pagoPorPidPer, pidsNuevos };
}

function calcularPeriodo(per, acc, pn, inversion, idx) {
  const accP = acc.filter(f => f[A_PER] === per);
  const pnP  = pn.filter(r => r[P_PER] === per);

  const facturacion = accP.reduce((s,f) => s + f[A_PAG], 0);
  const atenciones = new Set(accP.map(f => f[A_PID] + "|" + f[A_FEC])).size;
  const pacUnicos = new Set(accP.map(f => f[A_PID])).size;
  const ingAtencion = atenciones ? facturacion / atenciones : 0;
  const prodSillon = facturacion / 3;

  const totalPN = pnP.length;
  const conRef = pnP.filter(r => r[P_REF] !== "").length;
  const trazabilidad = totalPN ? conRef / totalPN : null;

  const porCanal = { META: [], GOOGLE: [], REFERIDOS: [], ORGANICO: [], OTRO: [] };
  for (const r of pnP) {
    const c = canalDe(r[P_REF]);
    if (porCanal[c]) porCanal[c].push(r[P_PID]);
  }

  const inv = inversion[per] || { meta: 0, google: 0 };
  const canalKpi = (pids, gasto) => {
    const n = pids.length;
    const ingMes = pids.reduce((s,p) => s + (idx.pagoPorPidPer.get(p + "|" + per) || 0), 0);
    const ingAcum = pids.reduce((s,p) => s + (idx.pagoPorPid.get(p) || 0), 0);
    return {
      pacientes: n, inversion: gasto || 0, ingMes, ingAcum,
      cpa: (n && gasto) ? gasto / n : null,
      roasMes: gasto ? ingMes / gasto : null,
      roasAcum: gasto ? ingAcum / gasto : null,
    };
  };
  const meta = canalKpi(porCanal.META, inv.meta);
  const google = canalKpi(porCanal.GOOGLE, inv.google);
  const referidos = {
    pacientes: porCanal.REFERIDOS.length,
    ingMes: porCanal.REFERIDOS.reduce((s,p) => s + (idx.pagoPorPidPer.get(p + "|" + per) || 0), 0),
    ingAcum: porCanal.REFERIDOS.reduce((s,p) => s + (idx.pagoPorPid.get(p) || 0), 0),
  };
  const organico = porCanal.ORGANICO.length;

  const mixMap = new Map();
  for (const f of accP) mixMap.set(f[A_CAT], (mixMap.get(f[A_CAT]) || 0) + f[A_PAG]);
  const mix = CATEGORIAS.map(c => ({ categoria: c, monto: mixMap.get(c) || 0 }));
  const sumaListadas = mix.reduce((s,m) => s + m.monto, 0);
  const otras = facturacion - sumaListadas;
  if (Math.abs(otras) > 0.5) mix.push({ categoria: "OTRAS (no clasificadas)", monto: otras });
  mix.forEach(m => { m.pct = facturacion ? m.monto / facturacion : 0; });

  let casosOrto = 0;
  idx.primeraOrto.forEach(p => { if (p === per) casosOrto++; });
  let casosImpl = 0;
  idx.primeraImpl.forEach(p => { if (p === per) casosImpl++; });

  const accClub = accP.filter(f => f[A_CON] === "CLUB SONRISA CEO");
  const clubOrto = accClub.filter(f => f[A_CAT] === "ORTODONCIA").reduce((s,f) => s + f[A_PAG], 0);
  const clubTotal = accClub.reduce((s,f) => s + f[A_PAG], 0);
  const clubOtros = clubTotal - clubOrto;

  const docMap = new Map();
  for (const f of accP) {
    if (!f[A_DOC]) continue;
    docMap.set(f[A_DOC], (docMap.get(f[A_DOC]) || 0) + f[A_PAG]);
  }
  const doctores = [...docMap.entries()]
    .map(([doctor, monto]) => ({ doctor, monto, pct: facturacion ? monto/facturacion : 0 }))
    .sort((a,b) => b.monto - a.monto);

  return {
    periodo: per, facturacion, atenciones, pacUnicos, ingAtencion, prodSillon,
    totalPN, conRef, trazabilidad, meta, google, referidos, organico,
    mix, casosOrto, casosImpl, clubOrto, clubOtros, clubTotal,
    clubPctOtros: clubTotal ? clubOtros/clubTotal : null, doctores,
  };
}

function calcularVentanas(per, acc, afiliados) {
  const serFin = pSerial(per);
  const en = (k, meses) => { const s = pSerial(k); return s <= serFin && s > serFin - meses; };
  const acc12 = acc.filter(f => en(f[A_PER], 12));
  const acc6  = acc.filter(f => en(f[A_PER], 6));

  const rutsActivos = new Set(acc12.map(f => f[A_RUT]).filter(Boolean));
  const setAfil = new Set(afiliados);
  let sociosActivos = 0;
  rutsActivos.forEach(r => { if (setAfil.has(r)) sociosActivos++; });

  const tratPorRut = new Map();
  for (const f of acc6) {
    if (!f[A_RUT] || !f[A_TRA] || !setAfil.has(f[A_RUT])) continue;
    if (!tratPorRut.has(f[A_RUT])) tratPorRut.set(f[A_RUT], new Set());
    tratPorRut.get(f[A_RUT]).add(f[A_TRA]);
  }
  let retorno = 0, enProceso = 0;
  afiliados.forEach(r => {
    const n = tratPorRut.has(r) ? tratPorRut.get(r).size : 0;
    if (n >= 2) retorno++; else if (n === 1) enProceso++;
  });
  const totalSocios = afiliados.length;

  return {
    pacientesActivos: rutsActivos.size, sociosActivos,
    tasaAfiliacion: rutsActivos.size ? sociosActivos / rutsActivos.size : null,
    totalSocios, retorno, enProceso, sinActividad: totalSocios - retorno - enProceso,
    tasaRetorno: totalSocios ? retorno / totalSocios : null,
  };
}

const Vacio = ({ titulo, texto, accion }) => (
  <Panel style={{ padding: "44px 28px", textAlign: "center" }}>
    <div className="disp" style={{ fontSize: 26, color: "var(--bone)" }}>{titulo}</div>

                  marginInline: "auto", lineHeight: 1.55 }}>{texto}</div>
    {accion && <div style={{ marginTop: 18 }}>{accion}</div>}
  </Panel>
);
const Boton = ({ children, onClick, tono = "base", disabled, chico }) => {
  const t = { base:  { bg: "var(--surf2)", bd: "var(--line)", fg: "var(--txt)" },
              claro: { bg: "var(--bone)",  bd: "var(--bone)", fg: "#0B0B0C" },
              peli:  { bg: "transparent",  bd: "#4A2A32",     fg: "var(--bad)" } }[tono];
  return (
    <button onClick={onClick} disabled={disabled}
      style={{ background: t.bg, border: `1px solid ${t.bd}`, color: t.fg,
               borderRadius: 7, padding: chico ? "6px 11px" : "9px 16px",
               fontSize: chico ? 12 : 13, fontWeight: 500,
               opacity: disabled ? .4 : 1, whiteSpace: "nowrap" }}>
      {children}
    </button>
  );
};
const MapaPeriodos = ({ periodosAcc, periodosPn, sel, onSel }) => {
  const setA = new Set(periodosAcc), setP = new Set(periodosPn);
  const todos = [...new Set([...periodosAcc, ...periodosPn])].sort();
  if (!todos.length) return (
    <div style={{ fontSize: 12, color: "var(--dim)", padding: "10px 0" }}>Sin períodos cargados todavía.</div>
  );
  const anios = [...new Set(todos.map(k => k.split("-")[0]))].sort();
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {anios.map(a => (
        <div key={a}>
          <div className="mono" style={{ fontSize: 10, color: "var(--dim)", marginBottom: 5 }}>{a}</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(12,1fr)", gap: 3 }}>
            {MES_ABR.map((m, i) => {
              const k = `${a}-${String(i+1).padStart(2,"0")}`;
              const hayA = setA.has(k), hayP = setP.has(k);
              const activo = hayA || hayP;
              const esSel = k === sel;
              return (
                <button key={k} onClick={() => activo && onSel(k)} disabled={!activo}
                  title={activo ? pLargo(k) : `${pLargo(k)} — sin datos`}
                  style={{ aspectRatio: "1", borderRadius: 4,
                    border: esSel ? "1.5px solid var(--bone)" : "1px solid var(--line)",
                    background: !activo ? "transparent" : (hayA && hayP) ? "#2E4A3A" : "#2A2F3E",
                    color: activo ? "var(--txt)" : "#3A3A40",
                    fontSize: 9, fontFamily: "'IBM Plex Mono',monospace",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    cursor: activo ? "pointer" : "default", padding: 0 }}>
                  {m[0]}
                </button>
              );
            })}
          </div>
        </div>
      ))}
      <div style={{ display: "flex", gap: 14, fontSize: 10, color: "var(--dim)", marginTop: 2, flexWrap: "wrap" }}>
        <span><i style={{ display:"inline-block", width:8, height:8, borderRadius:2, background:"#2E4A3A", marginRight:5 }} />Completo</span>
        <span><i style={{ display:"inline-block", width:8, height:8, borderRadius:2, background:"#2A2F3E", marginRight:5 }} />Parcial</span>
        <span><i style={{ display:"inline-block", width:8, height:8, borderRadius:2, border:"1px solid var(--line)", marginRight:5 }} />Sin datos</span>
      </div>
    </div>
  );
};

/* ═══════════════════ PANTALLA DE LOGIN ═══════════════════ */
function Login({ onLogin }) {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);

  const entrar = async (e) => {
    e.preventDefault();
    setCargando(true); setError("");
    const { data, error: err } = await sb.auth.signInWithPassword({ email, password: pass });
    setCargando(false);
    if (err) { setError("Correo o contraseña incorrectos."); return; }
    onLogin(data.session);
  };

  return (
    <div className="cmi" style={{ display:"grid", placeItems:"center", minHeight:"100vh", padding:20 }}>
      <Panel style={{ padding:"32px 28px", width:"100%", maxWidth:360 }}>
        <div style={{ textAlign:"center", marginBottom:24 }}>
          <div style={{ width:44, height:44, borderRadius:10, background:"var(--bone)",
                        display:"grid", placeItems:"center", margin:"0 auto 14px" }}>
            <span className="disp" style={{ fontSize:24, color:"#0B0B0C" }}>C</span>
          </div>
          <h1 style={{ fontSize:24 }}>CEO CLÍNICA DENTAL</h1>
          <div style={{ fontSize:11, color:"var(--dim)", marginTop:4 }}>Panel comercial · Acceso privado</div>
        </div>
        <form onSubmit={entrar} style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <div>
            <label style={{ fontSize:10, letterSpacing:".1em", textTransform:"uppercase",
                            color:"var(--dim)", display:"block", marginBottom:5 }}>Correo</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required />
          </div>
          <div>
            <label style={{ fontSize:10, letterSpacing:".1em", textTransform:"uppercase",
                            color:"var(--dim)", display:"block", marginBottom:5 }}>Contraseña</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} required />
          </div>
          {error && <div style={{ fontSize:12, color:"var(--bad)" }}>{error}</div>}
          <button type="submit" disabled={cargando}
            style={{ background:"var(--bone)", color:"#0B0B0C", borderRadius:7, padding:"11px 16px",
                     fontSize:14, fontWeight:600, marginTop:6, opacity: cargando?0.6:1 }}>
            {cargando ? "Entrando…" : "Entrar"}
          </button>
        </form>
      </Panel>
    </div>
  );
}

/* ═══════════════════ APP PRINCIPAL ═══════════════════ */
function PanelCMI({ session, onLogout }) {
  const [listo, setListo] = useState(false);
  const [acc, setAcc] = useState([]);
  const [pn, setPn] = useState([]);
  const [afiliados, setAfiliados] = useState([]);
  const [inversion, setInversion] = useState({});
  const [periodo, setPeriodo] = useState(null);
  const [tab, setTab] = useState("resumen");
  const [aviso, setAviso] = useState(null);
  const [cargando, setCargando] = useState(false);

  const refAcc = useRef(null), refPn = useRef(null), refAf = useRef(null);

  const notificar = (tipo, texto) => { setAviso({ tipo, texto }); setTimeout(() => setAviso(null), 7000); };

  const cargarTodo = async () => {
    const [{data:da}, {data:dp}, {data:df}, {data:di}] = await Promise.all([
      sb.from("cmi_acciones").select("*"),
      sb.from("cmi_pacientes_nuevos").select("*"),
      sb.from("cmi_afiliados").select("rut"),
      sb.from("cmi_inversion").select("*"),
    ]);
    setAcc((da||[]).map(accToArr));
    setPn((dp||[]).map(pnToArr));
    setAfiliados((df||[]).map(r=>r.rut));
    const invObj = {};
    (di||[]).forEach(r => { invObj[r.periodo] = { meta: Number(r.meta)||0, google: Number(r.google)||0 }; });
    setInversion(invObj);
    const disp = [...new Set([...(da||[]).map(r=>r.periodo), ...(dp||[]).map(r=>r.periodo)])].sort();
    setPeriodo(prev => prev && disp.includes(prev) ? prev : (disp.length ? disp[disp.length-1] : null));
  };

  useEffect(() => { (async () => { await cargarTodo(); setListo(true); })(); }, []);

  const periodosAcc = useMemo(() => [...new Set(acc.map(f => f[A_PER]))].sort(), [acc]);
  const periodosPn  = useMemo(() => [...new Set(pn.map(r => r[P_PER]))].sort(), [pn]);
  const periodos    = useMemo(() => [...new Set([...periodosAcc, ...periodosPn])].sort(), [periodosAcc, periodosPn]);

  const idx = useMemo(() => construirIndices(acc, pn), [acc, pn]);
  const K = useMemo(() => periodo ? calcularPeriodo(periodo, acc, pn, inversion, idx) : null,
                    [periodo, acc, pn, inversion, idx]);
  const V = useMemo(() => periodo ? calcularVentanas(periodo, acc, afiliados) : null,
                    [periodo, acc, afiliados]);

  const serie = useMemo(() => periodos.map(p => {
    const k = calcularPeriodo(p, acc, pn, inversion, idx);
    return { periodo: p, label: pLabel(p), facturacion: k.facturacion,
             atenciones: k.atenciones, ingAtencion: Math.round(k.ingAtencion),
             casosOrto: k.casosOrto, casosImpl: k.casosImpl,
             club: k.clubTotal, referidos: k.referidos.pacientes };
  }), [periodos, acc, pn, inversion, idx]);

  /* — Subir Acciones Realizadas — */
  const subirAcciones = (file) => {
    setCargando(true);
    Papa.parse(file, {
      header: true, skipEmptyLines: true, encoding: "UTF-8",
      complete: async (res) => {
        try {
          const cols = res.meta.fields || [];
          if (!cols.includes("# Paciente") || !cols.includes("Mes de realización")) {
            notificar("error", "Ese archivo no es de Acciones Realizadas: faltan columnas clave.");
            setCargando(false); return;
          }
          const { grupos, ignoradas } = mapAcciones(res.data);
          if (!grupos.size) { notificar("error", "No se encontraron filas con período válido."); setCargando(false); return; }
          const periodosSubidos = [...grupos.keys()];
          // Reemplazar por período: borrar y luego insertar
          for (const per of periodosSubidos) {
            await sb.from("cmi_acciones").delete().eq("periodo", per);
          }
          for (const per of periodosSubidos) {
            const filas = grupos.get(per);
            for (let i = 0; i < filas.length; i += 500) {
              await sb.from("cmi_acciones").insert(filas.slice(i, i+500));
            }
          }
          await cargarTodo();
          const pers = periodosSubidos.sort();
          if (!periodo || pers[pers.length-1] > periodo) setPeriodo(pers[pers.length-1]);
          notificar("ok", `Acciones cargadas: ${pers.map(pLabel).join(", ")}.${ignoradas ? ` ${ignoradas} filas sin período se omitieron.` : ""}`);
        } catch (e) { notificar("error", "No se pudo guardar: " + e.message); }
        setCargando(false);
      },
      error: () => { notificar("error", "No se pudo leer el archivo."); setCargando(false); }
    });
  };

  /* — Subir Pacientes Nuevos — */
  const subirPacientes = (file) => {
    setCargando(true);
    Papa.parse(file, {
      header: true, skipEmptyLines: true, encoding: "UTF-8",
      complete: async (res) => {
        try {
          const cols = res.meta.fields || [];
          if (!cols.includes("# Paciente") || !cols.includes("Mes de afiliación")) {
            notificar("error", "Ese archivo no es de Pacientes Nuevos: faltan columnas clave.");
            setCargando(false); return;
          }
          const { grupos, ignoradas } = mapPacientes(res.data);
          if (!grupos.size) { notificar("error", "No se encontraron filas con período válido."); setCargando(false); return; }
          const periodosSubidos = [...grupos.keys()];
          for (const per of periodosSubidos) {
            await sb.from("cmi_pacientes_nuevos").delete().eq("periodo", per);
          }
          for (const per of periodosSubidos) {
            const filas = grupos.get(per);
            for (let i = 0; i < filas.length; i += 500) {
              await sb.from("cmi_pacientes_nuevos").insert(filas.slice(i, i+500));
            }
          }
          await cargarTodo();
          const pers = periodosSubidos.sort();
          notificar("ok", `Pacientes nuevos cargados: ${pers.map(pLabel).join(", ")}.${ignoradas ? ` ${ignoradas} filas omitidas.` : ""}`);
        } catch (e) { notificar("error", "No se pudo guardar: " + e.message); }
        setCargando(false);
      },
      error: () => { notificar("error", "No se pudo leer el archivo."); setCargando(false); }
    });
  };

  /* — Subir Afiliados (sobrescribe) — */
  const subirAfiliados = (file) => {
    setCargando(true);
    Papa.parse(file, {
      header: true, skipEmptyLines: true, encoding: "UTF-8",
      complete: async (res) => {
        try {
          const cols = res.meta.fields || [];
          const colRut = cols.find(c => String(c).trim().toUpperCase() === "RUT");
          if (!colRut) { notificar("error", "Ese archivo no tiene una columna RUT."); setCargando(false); return; }
          const ruts = [...new Set(res.data.map(r => normRut(r[colRut])).filter(Boolean))];
          await sb.from("cmi_afiliados").delete().neq("rut", "___nada___");
          for (let i = 0; i < ruts.length; i += 500) {
            await sb.from("cmi_afiliados").insert(ruts.slice(i, i+500).map(rut => ({ rut })));
          }
          await cargarTodo();
          notificar("ok", `Afiliados actualizados: ${ruts.length} socios. El listado anterior fue reemplazado.`);
        } catch (e) { notificar("error", "No se pudo guardar: " + e.message); }
        setCargando(false);
      },
      error: () => { notificar("error", "No se pudo leer el archivo."); setCargando(false); }
    });
  };

  const borrarPeriodo = async (per) => {
    await sb.from("cmi_acciones").delete().eq("periodo", per);
    await sb.from("cmi_pacientes_nuevos").delete().eq("periodo", per);
    await cargarTodo();
    notificar("ok", `${pLargo(per)} eliminado.`);
  };

  const guardarInversion = async (per, campo, valor) => {
    const actual = inversion[per] || { meta:0, google:0 };
    const nuevaFila = { ...actual, [campo]: toNum(valor) };
    const nueva = { ...inversion, [per]: nuevaFila };
    setInversion(nueva);
    await sb.from("cmi_inversion").upsert({ periodo: per, meta: nuevaFila.meta, google: nuevaFila.google });
  };

  if (!listo) return (
    <div className="cmi" style={{ display:"grid", placeItems:"center", minHeight:"100vh" }}>
      <div className="disp" style={{ fontSize:22, color:"var(--dim)" }}>Cargando datos…</div>
    </div>
  );

  const hayDatos = periodos.length > 0;
  const TABS = [
    { id:"resumen",    n:"Resumen",          c:"var(--op)"   },
    { id:"publicidad", n:"Publicidad",       c:"var(--meta)" },
    { id:"mix",        n:"Mix de servicios", c:"var(--mix)"  },
    { id:"programas",  n:"Programas",        c:"var(--club)" },
    { id:"datos",      n:"Datos",            c:"var(--bone)" },
  ];
  const est = (v, m) => (v === null || v === undefined || !Number.isFinite(v)) ? null : (v >= m ? "ok" : "bad");
  const tt = { background:"#1C1C1F", border:"1px solid #2A2A2F", borderRadius:8, fontSize:12 };

  return (
    <div className="cmi">
      <header style={{ borderBottom:"1px solid var(--line)", background:"#0E0E10",
                       position:"sticky", top:0, zIndex:20 }}>
        <div style={{ maxWidth:1320, margin:"0 auto", padding:"16px 22px",
                      display:"flex", alignItems:"center", justifyContent:"space-between", gap:20, flexWrap:"wrap" }}>
          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            <div style={{ width:34, height:34, borderRadius:8, background:"var(--bone)",
                          display:"grid", placeItems:"center", flexShrink:0 }}>
              <span className="disp" style={{ fontSize:19, color:"#0B0B0C" }}>C</span>
            </div>
            <div>
              <h1 style={{ fontSize:23, lineHeight:1 }}>CEO CLÍNICA DENTAL</h1>
              <div style={{ fontSize:11, color:"var(--dim)", letterSpacing:".05em", marginTop:2 }}>
                Cuadro de mando comercial · Santiago
              </div>
            </div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            {hayDatos && (
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:10, letterSpacing:".12em", textTransform:"uppercase", color:"var(--dim)" }}>Período</span>
                <select value={periodo || ""} onChange={e => setPeriodo(e.target.value)}
                  style={{ width:"auto", minWidth:148, fontFamily:"'Bebas Neue',sans-serif",
                           fontSize:17, letterSpacing:".04em", padding:"5px 10px" }}>
                  {[...periodos].reverse().map(p => <option key={p} value={p}>{pLargo(p).toUpperCase()}</option>)}
                </select>
              </div>
            )}
            <Boton chico onClick={onLogout}>Salir</Boton>
          </div>
        </div>
        <div style={{ maxWidth:1320, margin:"0 auto", padding:"0 22px", display:"flex", gap:2, overflowX:"auto" }}>
          {TABS.map(t => (

                       color: tab===t.id ? "var(--txt)" : "var(--dim)",
                       borderBottom: tab===t.id ? `2px solid ${t.c}` : "2px solid transparent",
                       whiteSpace:"nowrap" }}>{t.n}</button>

        <div style={{ maxWidth:1320, margin:"0 auto", fontSize:10.5, color:"#5A5A62",
                      display:"flex", justifyContent:"space-between", gap:14, flexWrap:"wrap" }}>
          <span>Centro de Especialidades Odontológicas Santiago SpA · RUT 76.591.033-1</span>
          <span>{acc.length.toLocaleString("es-CL")} acciones · {pn.length.toLocaleString("es-CL")} pacientes nuevos · {afiliados.length.toLocaleString("es-CL")} socios</span>
        </div>
      </footer>
    </div>
  );
}

/* ═══════════════════ RAÍZ: LOGIN + APP ═══════════════════ */
function Root() {
  const [session, setSession] = useState(undefined); // undefined = cargando, null = sin sesión

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (session === undefined) return (
    <div className="cmi" style={{ display:"grid", placeItems:"center", minHeight:"100vh" }}>
      <div className="disp" style={{ fontSize:22, color:"var(--dim)" }}>Cargando…</div>
    </div>
  );
  if (!session) return <Login onLogin={setSession} />;
  return <PanelCMI session={session} onLogout={() => sb.auth.signOut()} />;
}

document.getElementById("root").dataset.appReady = "1";
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);

} catch (e) {
  console.error("Error al iniciar el panel:", e);
  document.getElementById("root").innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;background:#0B0B0C;color:#fff;font-family:system-ui,sans-serif">' +
    '<div><div style="font-size:24px;font-weight:700;color:#FB7185">NO SE PUDO INICIAR EL PANEL</div>' +
    '<div style="font-size:13px;color:#9A9AA2;margin-top:10px;max-width:440px">' + (e && e.message ? e.message : String(e)) + '</div>' +
    '<div style="font-size:11px;color:#5A5A62;margin-top:16px">Si el problema persiste, avisa a Claude con este mensaje de error.</div></div></div>';
}
</script>
